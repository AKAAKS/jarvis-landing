<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />

    <title>JARVIS · The assistant you own cannot do this</title>
    <meta
      name="description"
      content="A voice assistant that runs on my own PC and has hands on it: it opened the transit site, then Maps with the walking route from my address, and closed the app I did not want running. Every call is permission-checked and logged."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jarvis-landing-sooty.vercel.app/" />
    <meta property="og:title" content="JARVIS · The assistant you own cannot do this" />
    <meta
      property="og:description"
      content="A voice assistant on my own machine. It opened the transit site, then Maps with the walking route from my address, and closed the app I did not want running. Every call permission-checked and logged."
    />
    <!-- Photographed from the real page by `npm run og`, not redrawn. A
         hand-built card is a second drawing of the same thing and drifts from
         the first one silently; a photograph of the page cannot disagree with
         it. Regenerate whenever the hero changes. -->
    <meta property="og:image" content="https://jarvis-landing-sooty.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The JARVIS landing page: the line 'Ask your smart speaker when your bus leaves. It cannot tell you.' in near-white on near-black."
    />

    <!-- summary_large_image, not summary: plain `summary` crops to a small
         square and throws away the composition the card exists for. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JARVIS · The assistant you own cannot do this" />
    <meta
      name="twitter:description"
      content="A voice assistant on my own machine, shown through its own logs."
    />
    <meta name="twitter:image" content="https://jarvis-landing-sooty.vercel.app/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two faces, both at the weights the CSS actually sets. Sora is gone
         along with the orb: headings on this page are set in the body face at
         the same dim grey as the log, so a third display face had no job. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
